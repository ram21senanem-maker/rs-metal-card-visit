<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Metal | تلحيم المعادن الاحترافي</title>
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة توليد QR Code تلقائياً -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #ff6b00;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #b0b0b0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #333;
            text-align: center;
            padding: 30px 20px;
        }
        .header-logo {
            font-size: 55px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        h1 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .tagline {
            color: var(--primary-color);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .speciality {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 12px 10px;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }
        .speciality strong {
            color: var(--text-color);
        }
        .actions-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #2a2a2a;
            color: var(--text-color);
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            border: 1px solid #444;
            cursor: pointer;
        }
        .btn:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-primary:hover {
            background: #e05e00;
        }
        .btn i {
            font-size: 18px;
        }
        /* قسم الـ QR Code داخل البطاقة */
        .qr-section {
            background: #252525;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid #333;
        }
        .qr-section p {
            font-size: 13px;
            color: var(--text-muted);
        }
        #qrcode img {
            display: block;
            margin: 0 auto;
            border-radius: 6px;
            padding: 5px;
            background: #fff;
        }
        .footer-note {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header-logo">
            <i class="fa-solid fa-fire-flame-curved"></i>
        </div>
        <h1>RS Metal</h1>
        <div class="tagline">إذا كنت بحاجة الى تلحيم المعادن هنا الحل</div>
        
        <div class="speciality">
            <strong>التخصص:</strong> تلحيم كافة أنواع المعادن<br>
            (حديد، إنوكس، ألمنيوم، نحاس)<br>
            <div style="margin-top: 8px;">
                <i class="fa-solid fa-location-dot" style="color: var(--primary-color);"></i> تمالوس، سكيكدة، الجزائر
            </div>
        </div>

        <div class="actions-grid">
            <!-- زر حفظ جهة الاتصال (vCard) -->
            <button class="btn btn-primary" onclick="downloadVCard()">
                <i class="fa-solid fa-user-plus"></i> حفظ جهة الاتصال في الهاتف
            </button>

            <!-- زر مشاركة البطاقة -->
            <button class="btn" onclick="shareCard()">
                <i class="fa-solid fa-share-nodes" style="color: var(--primary-color);"></i> مشاركة البطاقة مع الآخرين
            </button>

            <!-- زر الاتصال المباشر -->
            <a href="tel:00213666114800" class="btn">
                <i class="fa-solid fa-phone"></i> اتصال هاتفي مباشر
            </a>

            <!-- زر الواتساب -->
            <a href="https://wa.me/213666114800" target="_blank" class="btn">
                <i class="fa-brands fa-whatsapp" style="color: #25d366; font-size: 20px;"></i> مراسلة عبر الواتساب
            </a>

            <!-- زر البريد الإلكتروني -->
            <a href="mailto:rsmetal822@gmail.com" class="btn">
                <i class="fa-solid fa-envelope"></i> مراسلة عبر البريد الإلكتروني
            </a>

            <!-- زر الموقع الجغرافي -->
            <a href="https://maps.google.com/?q=Temalous,Skikda" target="_blank" class="btn">
                <i class="fa-solid fa-map-location-dot"></i> الموقع على خرائط جوجل
            </a>
        </div>

        <!-- خانة عرض QR Code التلقائي -->
        <div class="qr-section">
            <p><i class="fa-solid fa-qrcode"></i> امسح الرمز لفتح البطاقة فوراً</p>
            <div id="qrcode"></div>
        </div>

        <div class="footer-note">
            RS Metal © 2026 - جميع الحقوق محفوظة
        </div>
    </div>

    <script>
        // توليد الـ QR Code تلقائياً بناءً على رابط الصفحة الحالي (أو يمكنك وضع رابط موقعك الثابت)
        const currentUrl = window.location.href;
        new QRCode(document.getElementById("qrcode"), {
            text: currentUrl,
            width: 128,
            height: 128,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // دالة مشاركة البطاقة عبر نظام الهاتف
        function shareCard() {
            if (navigator.share) {
                navigator.share({
                    title: 'RS Metal | تلحيم المعادن',
                    text: 'تفضل بزيارة بطاقة أعمال RS Metal لتلحيم المعادن (حديد، إنوكس، ألمنيوم، نحاس) في تمالوس، سكيكدة.',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                alert('عذراً، خاصية المشاركة غير متوفرة في هذا المتصفح. يمكنك نسخ الرابط يدوياً.');
            }
        }

        // دالة توليد وتنزيل ملف vCard لحفظ جهة الاتصال
        function downloadVCard() {
            const vcard = `BEGIN:VCARD
VERSION:3.0
FN:RS Metal
TITLE:تلحيم المعادن (حديد، إنوكس، ألمنيوم، نحاس)
TEL;TYPE=WORK,VOICE:+213666114800
EMAIL:rsmetal822@gmail.com
NOTE:إذا كنت بحاجة الى تلحيم المعادن هنا الحل - تمالوس، سكيكدة
END:VCARD`;

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'RS_Metal.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
